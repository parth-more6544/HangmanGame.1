<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D52724" />
      <stop offset="50%" stop-color="#F04432" />
      <stop offset="100%" stop-color="#D95932" />
    </linearGradient>
  </defs>

  <!-- Marquee Border Box -->
  <rect x="4" y="4" width="312" height="72" rx="8" fill="#09070E" stroke="#59151B" stroke-width="2" />
  <rect x="8" y="8" width="304" height="64" rx="6" fill="#180C15" stroke="#D52724" stroke-width="1.5" filter="url(#neon-glow)" opacity="0.85" />

  <!-- Mini Gallows Vector Icon -->
  <path d="M 28 60 L 52 60 M 36 60 L 36 20 L 50 20 L 50 26 M 36 30 L 44 20" 
        stroke="#D95932" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="50" cy="30" r="4" stroke="#F04432" stroke-width="2" fill="none" />
  <line x1="50" y1="34" x2="50" y2="44" stroke="#F04432" stroke-width="2" />
  <line x1="50" y1="38" x2="44" y2="42" stroke="#F04432" stroke-width="2" />
  <line x1="50" y1="38" x2="56" y2="42" stroke="#F04432" stroke-width="2" />

  <!-- Logo Text -->
  <text x="68" y="46" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" 
        fill="#F5E9E0" stroke="#D52724" stroke-width="1.2" letter-spacing="4" filter="url(#neon-glow)">
    HANGMAN
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="70" y="62" font-family="'Courier New', monospace" font-size="9" font-weight="700" 
        fill="#DE9C57" letter-spacing="3">
    GUESS • SURVIVE • WIN
  </text>
</svg>
